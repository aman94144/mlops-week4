name: Sanity Test and CML Report

on:
  pull_request:
    branches: [ main ]

jobs:
  run-sanity-test:
    runs-on: ubuntu-latest

    # Explicitly grant the required permissions for this job
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline and tests
        run: |
          pytest --verbose | tee report.md

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install CML
        run: npm install -g @dvcorg/cml
      
      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i '1s,^,## ✅ Sanity Test & Model Evaluation Report\n\n,' report.md
          cml comment create report.md
